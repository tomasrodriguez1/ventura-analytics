name: CI (Astro static build)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build (Astro static -> dist/)
        run: npm run build

      - name: Verify build output
        run: |
          test -d dist
          test -f dist/index.html
          test -f dist/_headers
          test -f dist/robots.txt
          test -f dist/sitemap.xml
          test -f dist/blog/index.html
          test -f dist/consultor-ia/index.html
          test -f dist/productos/index.html
          test -f dist/privacy/index.html
